<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151528">
<title>Circuito Lunar</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<div class="shell">
  <header class="mast">
    <div class="brand"><span class="brand-icon" aria-hidden="true">◒</span><div><strong>CIRCUITO LUNAR</strong><small>CONTROL DE CARRERA</small></div></div>
    <div class="mast-actions"><span class="connection" id="connection"><i></i> Cargando</span><a class="button outline" href="/live" target="_blank" rel="noopener">Abrir vista LIVE ↗</a></div>
  </header>
  <main class="layout">
    <aside class="controls" aria-label="Controles">
      <section class="card">
        <div class="section-title"><h2>Sesión</h2><span class="tag" id="modeTag">DEMO</span></div>
        <div class="segmented" aria-label="Modo de sesión">
          <button type="button" data-action="mode" data-mode="demo">Demo</button>
          <button type="button" data-action="mode" data-mode="live">TikTok LIVE</button>
        </div>
        <p id="bridgeHelp" class="muted">Prueba la carrera con pilotos de muestra.</p>
        <button type="button" class="outline full" id="reconnect" data-action="reconnect" hidden>Volver a conectar</button>
      </section>
      <section class="card">
        <div class="section-title"><h2>Carrera</h2><span class="tag" id="phaseTag">PARRILLA</span></div>
        <button type="button" class="primary full" id="start" data-action="start">▶ Iniciar carrera</button>
        <div class="two">
          <button type="button" class="outline" id="pause" data-action="pause">Pausar</button>
          <button type="button" class="outline" data-action="reset">Nueva ronda</button>
        </div>
        <button type="button" class="text-button" data-action="reset" data-clear="true">Vaciar parrilla y cola</button>
        <p class="muted" id="queueHelp">0 en espera</p>
      </section>
      <section class="card" id="simulator">
        <h2>Simulador</h2>
        <form id="joinForm" class="join-form">
          <label class="sr-only" for="demoName">Nombre del piloto</label>
          <input id="demoName" placeholder="Nombre del piloto" maxlength="24" autocomplete="off">
          <button class="outline" type="submit">Añadir</button>
        </form>
        <label class="sr-only" for="target">Piloto para los efectos de prueba</label>
        <select id="target"></select>
        <div class="two">
          <button type="button" class="outline" data-action="simulate" data-event="boost">⚡ Turbo</button>
          <button type="button" class="outline" data-action="simulate" data-event="gift">✦ Regalo</button>
        </div>
      </section>
    </aside>
    <section class="preview" aria-label="Vista de la carrera">
      <div class="preview-head"><h1>Vista de transmisión</h1><span>9:16</span></div>
      <div class="stage" id="stage">
        <canvas id="track" width="1080" height="1920" aria-label="Carrera en Circuito Lunar"></canvas>
        <div class="stage-top">
          <div class="stage-mark"><span aria-hidden="true">◒</span><span>CIRCUITO<br>LUNAR</span></div>
          <div class="timing"><span id="clock">02:00</span><small id="lap">VUELTA 1/3</small></div>
        </div>
        <div class="stage-ranking" id="stageRanking"></div>
        <div class="stage-callout" id="callout"></div>
        <div class="stage-effect" id="effect" hidden></div>
        <div class="stage-bottom"><span id="chatJoin"></span><span id="chatBoost"></span></div>
      </div>
    </section>
    <aside class="details" aria-label="Clasificación y reglas">
      <section class="card">
        <div class="section-title"><h2>Clasificación</h2><span class="tag" id="racers">0 PILOTOS</span></div>
        <ol id="ranking" class="ranking"></ol>
      </section>
      <section class="card">
        <h2>Actividad</h2>
        <ul id="activity" class="activity"></ul>
      </section>
      <section class="card">
        <h2>Reglas de la ronda</h2>
        <form id="rules">
          <div class="two">
            <label>Vueltas<input name="laps" type="number" min="1" max="8" required></label>
            <label>Tiempo (s)<input name="seconds" type="number" min="30" max="600" required></label>
          </div>
          <label>Límite de pilotos<input name="maxRacers" type="number" min="6" max="48" required></label>
          <div class="two">
            <label>Entrada<input name="join" maxlength="20" required></label>
            <label>Turbo<input name="boost" maxlength="20" required></label>
          </div>
          <label class="check"><input name="gifts" type="checkbox"> Regalos con efecto</label>
          <button class="outline full" type="submit">Guardar reglas</button>
        </form>
      </section>
    </aside>
  </main>
  <div class="notice" id="notice" role="status" hidden></div>
</div>
</body>
</html>
